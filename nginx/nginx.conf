worker_processes auto;

# Required for os.getenv() in Lua
env REDIS_LOCATION;
env WAITING_ROOM_SECRET;
env WAITING_ROOM_MAX_USERS;
env WAITING_ROOM_BLOCKED_UNTIL;
env WAITING_ROOM_BLOCK_DURATION_MINUTES;
env WAITING_ROOM_QUEUED_TTL;
env WAITING_ROOM_GRANTED_TTL;
env WAITING_ROOM_ACCESS_TOKEN_TTL;

events {
    worker_connections 4096;
}

http {
    lua_package_path "/usr/local/openresty/lua/?.lua;;";

    # Shared memory for promotion rate-limiting (no Redis call needed)
    lua_shared_dict waiting_room 1m;

    # Seed math.random per worker for session ID generation
    init_worker_by_lua_block {
        math.randomseed(ngx.time() + ngx.worker.pid())
    }

    error_log /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log;

    server {
        listen 80;
        server_name _;

        client_max_body_size 100M;

        location /kdp/ {
            set $waiting_room_enabled "${WAITING_ROOM_ENABLED}";  # gets replaced by envsubst
            if ($waiting_room_enabled = "1") {
                set $should_redirect 1;
            }
            if ($cookie_waiting_room_access_token = "") {
                set $should_redirect "${should_redirect}1";
            }

            if ($should_redirect = "11") {
                return 302 /waiting-room?next=$request_uri;
            }

            proxy_pass http://pretix:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /waiting-room {
            content_by_lua_file /usr/local/openresty/lua/waiting_room.lua;
        }

        location / {
            proxy_pass http://pretix:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
