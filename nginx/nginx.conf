worker_processes auto;
worker_rlimit_nofile 65535;

# Required for os.getenv() in Lua
env REDIS_LOCATION;
env WAITING_ROOM_SECRET;
env WAITING_ROOM_MAX_USERS;
env WAITING_ROOM_BLOCKED_UNTIL;
env WAITING_ROOM_BLOCK_DURATION_MINUTES;
env WAITING_ROOM_QUEUED_TTL;
env WAITING_ROOM_GRANTED_TTL;
env WAITING_ROOM_ACCESS_TOKEN_TTL;
env WAITING_ROOM_DEBUG;

events {
    worker_connections 16384;
    multi_accept on;
    use epoll;
}

http {
    lua_package_path "/usr/local/openresty/lua/?.lua;;";

    # Shared memory for promotion rate-limiting (no Redis call needed)
    lua_shared_dict waiting_room 4m;

    # Rate limit: max 10 req/s per IP on the waiting room, burst of 20.
    # Uses $rate_limit_key which is set to "" in debug mode — nginx skips
    # rate limiting entirely when the key is empty.
    limit_req_zone $rate_limit_key zone=waiting_room_limit:10m rate=10r/s;
    limit_req_status 429;

    # Read debug flag once at startup — workers inherit via fork
    init_by_lua_block {
        waiting_room_debug = (os.getenv("WAITING_ROOM_DEBUG") == "1")
    }

    # Seed math.random per worker for session ID generation
    # Worker 0 runs background timers: promotion (every 2s) and stale cleanup (every 30s)
    init_worker_by_lua_block {
        math.randomseed(ngx.time() + ngx.worker.pid())

        if ngx.worker.id() == 0 then
            require("background_workers").start()
        end
    }

    error_log /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log;

    server {
        listen 80;
        server_name _;

        # Use relative redirects so they work behind reverse proxies / docker port mapping
        absolute_redirect off;

        client_max_body_size 100M;

        location ${WAITING_ROOM_PROTECTED_PATH} {
            set $waiting_room_enabled "${WAITING_ROOM_ENABLED}";  # gets replaced by envsubst
            if ($waiting_room_enabled = "1") {
                set $should_redirect 1;
            }
            if ($cookie_waiting_room_access_token = "") {
                set $should_redirect "${should_redirect}1";
            }

            if ($should_redirect = "11") {
                return 302 /waiting-room?next=$request_uri;
            }

            proxy_pass ${WAITING_ROOM_UPSTREAM_URL};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /waiting-room {
            set_by_lua_block $rate_limit_key {
                if waiting_room_debug then return "" end
                return ngx.var.binary_remote_addr
            }
            limit_req zone=waiting_room_limit burst=20 nodelay;
            content_by_lua_file /usr/local/openresty/lua/waiting_room.lua;
        }

        location / {
            proxy_pass ${WAITING_ROOM_UPSTREAM_URL};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
